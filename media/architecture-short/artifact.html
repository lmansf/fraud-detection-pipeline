<style>
  /* Layout: one centered column; the animation is the page, controls sit directly under it. */
  :root {
    --bg: #070B16;
    --panel: #0F1628;
    --line: #22304D;
    --fg: #F1F5F9;
    --muted: #94A3B8;
    --accent: #F5B942;
    --font: Inter, "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); }
  main { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 40px; display: grid; gap: 16px; }
  header { display: grid; gap: 4px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
  h1 { margin: 0; font-size: clamp(22px, 5vw, 28px); font-weight: 800; text-wrap: balance; }
  .frame { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--bg); }
  #stage { display: block; width: 100%; height: auto; aspect-ratio: 1080 / 1350; font-family: var(--font); }
  .controls { display: flex; align-items: center; gap: 12px; }
  .controls button {
    font: 600 14px var(--font); color: var(--bg); background: var(--accent);
    border: 0; border-radius: 999px; padding: 9px 18px; cursor: pointer; min-width: 84px;
  }
  .controls button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  .controls button:focus-visible, #ctlScrub:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  #ctlScrub { flex: 1; min-width: 0; accent-color: var(--accent); }
  #ctlClock { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .note { margin: 0; font-size: 13px; line-height: 1.55; color: var(--muted); }
  .note code { color: var(--fg); font-size: 12px; }
</style>

<main>
  <header>
    <span class="eyebrow">LinkedIn short · 1080 × 1350 · 28 s</span>

<svg id="stage" role="img" aria-label="Animated walkthrough: an Owl Park checkout is scored in real time by Model 1, events land in Supabase raw tables, Databricks refines them through bronze, silver and gold layers, and gold feeds Model 1, the Model 2 safety net and self-service dashboards." viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="controls">
    <button id="ctlPlay" type="button">Pause</button>
    <button id="ctlReplay" class="ghost" type="button">Replay</button>
    <input id="ctlScrub" type="range" min="0" max="28" step="0.01" value="0" aria-label="Scrub timeline">
    <span id="ctlClock">0:00 / 0:28</span>
  </div>
  <p class="note">The exported video is <code>media/architecture-short/owl-park-pipeline.mp4</code> in the repo, with <code>poster.png</code> for the thumbnail. Rebuild both with <code>node render.js</code>.</p>
</main>

const CAPTIONS = [
  { s: 2.6, e: 5.5, title: "A generator streams orders", sub: "Synthetic Owl Park purchases: tickets, passes, gift cards", step: 1 },
  { s: 5.5, e: 10.5, title: "Model 1 scores it in real time", sub: "Approve or decline before checkout finishes", step: 2 },
  { s: 10.5, e: 14.5, title: "Every event lands in Supabase", sub: "Purchases, decisions and responses as raw tables", step: 3 },
  { s: 14.5, e: 19, title: "Databricks refines the data", sub: "Bronze → Silver → Gold", step: 4 },
  { s: 19, e: 23, title: "Gold powers every output", sub: "Two models plus self-service dashboards", step: 5 },
  { s: 23, e: DURATION + 1, title: "Fraud stopped in milliseconds", sub: "with a batch safety net for anything missed", step: 6 },
];

// Camera keyframes: world point (cx, cy) is placed at screen (540, 750) with zoom s.
const CAM = [
  [0, 190, 372, 1.9], [5.4, 190, 372, 1.9], [6.3, 540, 380, 1.18], [10.4, 540, 380, 1.18],
  [11.3, 540, 485, 1.12], [14.4, 540, 485, 1.12], [15.3, 540, 750, 1.1], [18.9, 540, 750, 1.1],
  [19.8, 540, 1000, 1.1], [22.9, 540, 1000, 1.1], [24.3, 540, 750, 1.0],
];
function camera(t) {
  let i = 0;
  while (i < CAM.length - 1 && t >= CAM[i + 1][0]) i++;
  if (i === CAM.length - 1) return CAM[i].slice(1);
  const [t0, x0, y0, s0] = CAM[i], [t1, x1, y1, s1] = CAM[i + 1];
  const k = easeInOut(prog(t, t0, t1 - t0));
  return [lerp(x0, x1, k), lerp(y0, y1, k), Math.exp(lerp(Math.log(s0), Math.log(s1), k))];
}

const P = [];
const add = (path, s, d, color = C.gold) => P.push({ path, s, d, color });
add("a1", 6.6, 0.7); add("a2", 7.8, 0.6);
add("a1", 8.7, 0.6, C.coral); add("a2", 9.6, 0.6, C.coral);
for (const w of [11.8, 12.9]) { add("d1", w, 0.8); add("d2", w + 0.1, 0.9); add("d3", w + 0.2, 0.9); }
for (const w of [15.8, 17.3]) {
  ["i1", "i2", "i3", "i4"].forEach((p, k) => add(p, w + k * 0.06, 0.9));
  add("m1", w + 1.0, 0.5); add("m2", w + 1.55, 0.5);
}
for (const w of [20.1, 21.0]) { add("g1", w, 0.8); add("g2", w, 0.7); add("g3", w, 0.55); }
add("loop", 21.9, 1.1);
const STAGES = [["a1", 0], ["a2", 0.7], ["d1", 1.0], ["d2", 1.1], ["d3", 1.2], ["i1", 2.0], ["i2", 2.05], ["i3", 2.1],
                ["i4", 2.15], ["m1", 3.0], ["m2", 3.5], ["g1", 4.0], ["g2", 4.0], ["g3", 4.0]];
for (let k = 0; k < 8; k++) {
  const base = 23.4 + k * 0.85 - 4.5;
  for (const [path, off] of STAGES) {
    const s = base + off;
    if (s >= 23.4 && s < DURATION - 0.3) {
      const fraud = (path === "a1" || path === "a2") && k % 3 === 2;
      add(path, s, path.startsWith("a") || path.startsWith("m") ? 0.55 : 0.8, fraud ? C.coral : C.gold);
    }
  }
}
const arrivals = (paths) => P.filter((p) => paths.includes(p.path)).map((p) => p.s + p.d).sort((a, b) => a - b);
const ARR = {
  owl: arrivals(["a1", "loop"]), c0: arrivals(["d1"]), c1: arrivals(["d2"]), c2: arrivals(["d3"]),
  bronze: arrivals(["i1", "i2", "i3", "i4"]), silver: arrivals(["m1"]), gold: arrivals(["m2"]),
  k1: arrivals(["g1"]), k2: arrivals(["g2"]), k3: arrivals(["g3"]),
};
const bump = (t, times, len = 0.35) =>
  times.reduce((m, a) => (t >= a && t <= a + len ? Math.max(m, Math.sin(((t - a) / len) * Math.PI)) : m), 0);
const countEased = (t, times, len = 0.4) => times.reduce((n, a) => n + easeOut(prog(t, a, len)), 0);
const lastBefore = (t, times) => { let r = -1; for (const a of times) if (a <= t) r = a; return r; };

// ---------- caption builder (word-by-word kinetic type) ----------
let capCache = {};
function buildLine(g, text, y, size, weight, fill) {
  const words = text.split(" ");
  const els = words.map((w) => el("text", { y, "font-size": size, "font-weight": weight, fill }, g, w));
  const widths = els.map((e) => e.getComputedTextLength());
  const p1 = el("text", { "font-size": size, "font-weight": weight }, g, "a a");
  const p2 = el("text", { "font-size": size, "font-weight": weight }, g, "aa");
  const space = p1.getComputedTextLength() - p2.getComputedTextLength();
  p1.remove(); p2.remove();
  let x = 540 - (widths.reduce((a, b) => a + b, 0) + space * (words.length - 1)) / 2;
  els.forEach((e, k) => { e.dataset.x = x; x += widths[k] + space; });
  return els;
}
function caption(i) {
  if (!capCache[i]) {
    const g = el("g", {}, capLayer);
    const c = CAPTIONS[i];
    capCache[i] = { g, title: buildLine(g, c.title, 166, 50, 800, C.fg), sub: buildLine(g, c.sub, 212, 28, 400, C.muted) };
  }
  return capCache[i];
}
if (document.fonts) document.fonts.ready.then(() => { capLayer.replaceChildren(); capCache = {}; });

// ============================================================ render(t)
function wire(id, t, start, dur = 0.6) {
  const k = easeInOut(prog(t, start, dur));
  const e = $(id);
  e.style.strokeDashoffset = (pathLen[id] * (1 - k)).toFixed(2);
  O(e, k > 0 ? 1 : 0);
}
function popIn(e, cx, cy, t, start, dur = 0.5, extra = 0) {
  const x = prog(t, start, dur);
  const s = (x <= 0 ? 0.001 : x >= 1 ? 1 : Math.max(0.001, backOut(x))) + extra;
  O(e, x * 3);
  T(e, scaleAt(cx, cy, s));
}
function riseIn(e, t, start, dur = 0.6, dy = 40) {
  const k = easeOut(prog(t, start, dur));
  O(e, k);
  T(e, `translate(0,${((1 - k) * dy).toFixed(2)})`);
}

function render(t) {
  // background orbs drift slowly
  [[300, 380, 0.21, 0], [820, 900, 0.17, 2], [420, 1180, 0.13, 4]].forEach(([x, y, w, ph], k) => {
    orbs[k].setAttribute("cx", (x + 140 * Math.sin(t * w + ph)).toFixed(1));
    orbs[k].setAttribute("cy", (y + 90 * Math.cos(t * w * 1.3 + ph)).toFixed(1));
  });

  // intro: owl pops, blinks, then an iris wipe opens the scene
  popIn(owlIntro, 540, 540, t, 0.05, 0.6);
  T(introEyes, scaleAt(540, 520, 1, 1 - 0.92 * bump(t, [1.2], 0.22)));
  riseIn(introTitle, t, 0.35, 0.6); riseIn(introSub, t, 0.55, 0.6);
  O(intro, 1 - prog(t, 2.6, 0.3));
  const irisR = 1100 * easeInOut(prog(t, 2.1, 0.85));
  irisC.setAttribute("r", irisR.toFixed(1));
  irisRing.setAttribute("r", irisR.toFixed(1));
  O(irisRing, t > 2.1 && irisR < 1050 ? 1 - irisR / 1100 : 0);

  // camera
  const [cx, cy, s] = camera(t);
  T(world, `translate(540,750) scale(${s.toFixed(4)}) translate(${(-cx).toFixed(2)},${(-cy).toFixed(2)})`);

  // captions
  CAPTIONS.forEach((c, i) => {
    const active = t >= c.s - 0.01 && t < c.e;
    if (!active) { if (capCache[i]) O(capCache[i].g, 0); return; }
    const cap = caption(i);
    O(cap.g, 1);
    const out = easeInOut(prog(t, c.e - 0.3, 0.3));
    const animate = (els, delay) => els.forEach((e, k) => {
      const kin = easeOut(prog(t, c.s + delay + k * 0.06, 0.45));
      O(e, kin * (1 - out));
      e.setAttribute("x", e.dataset.x);
      T(e, `translate(0,${((1 - kin) * 34 - out * 16).toFixed(2)})`);
    });
    animate(cap.title, 0); animate(cap.sub, 0.2);
  });
  const cur = CAPTIONS.find((c) => t >= c.s && t < c.e);
  const step = cur ? cur.step : 0;
  O(header, prog(t, 2.5, 0.4));
  dots.forEach((r, i) => {
    let x = 540 - (4 * 18 + 10 * 4 + 34) / 2;
    for (let j = 0; j < i; j++) x += (step === j + 1 ? 34 : 10) + 18;
    r.setAttribute("x", x.toFixed(1));
    r.setAttribute("width", step === i + 1 ? 34 : 10);
    r.setAttribute("fill", step >= i + 1 ? C.gold : "#2A3655");
  });

  // ---- row 1
  popIn(nCheckout, 190, 380, t, 2.7, 0.55);
  // streaming log: a new order line every LOG_EVERY seconds, older lines scroll up
  const nLines = t < LOG_START ? 0 : Math.floor((t - LOG_START) / LOG_EVERY) + 1;
  const newest = LOG_START + (nLines - 1) * LOG_EVERY;
  const slide = nLines ? 1 - easeOut(prog(t, newest, 0.22)) : 0;
  logPool.forEach((slot, j) => {
    const i = nLines - 1 - j;              // j = 0 is the newest line
    if (i < 0) { O(slot.g, 0); return; }
    const y = 420 - 19 * j + 19 * slide;
    O(slot.g, j === 0 ? 1 - slide * 0.6 : 1);
    T(slot.g, `translate(0,${y.toFixed(1)})`);
    const born = LOG_START + i * LOG_EVERY;
    slot.bar.setAttribute("width", (LOG_W[i % 7] * easeOut(prog(t, born, 0.3))).toFixed(1));
    slot.bar.setAttribute("fill", LOG_COLORS[i % 7]);
  });
  popIn(pricePill, 190, 296, t, 3.1, 0.45);
  priceText.textContent = `$${(727.16 * easeOut(prog(t, 3.2, 1.5))).toFixed(2)}`;

  popIn(nOwl, 540, 375, t, 5.7, 0.6, 0.07 * bump(t, ARR.owl));
  const blink = bump(t, [4.0, 12.4, 16.9, 21.2, 25.6], 0.2);
  T(owlEyes, scaleAt(540, 368, 1, 1 - 0.9 * blink));
  const look = P.some((p) => p.path === "a1" && t >= p.s && t <= p.s + p.d) ? -6
             : P.some((p) => p.path === "a2" && t >= p.s && t <= p.s + p.d) ? 6
             : P.some((p) => p.path === "loop" && t >= p.s && t <= p.s + p.d) ? 0 : 0;
  const lookUp = P.some((p) => p.path === "loop" && t >= p.s && t <= p.s + p.d) ? -6 : 0;
  pupils.forEach((p, k) => { p.setAttribute("cx", [518, 562][k] + look); p.setAttribute("cy", 368 + lookUp); });
  let pr = 70, po = 0;
  for (const a of ARR.owl) { const x = prog(t, a, 0.6); if (t >= a && x < 1) { pr = 70 + 75 * easeOut(x); po = 0.7 * (1 - x); } }
  pulse.setAttribute("r", pr.toFixed(1)); O(pulse, po);

  popIn(nResponse, 890, 380, t, 6.0, 0.55);
  wire("a1", t, 6.0); wire("a2", t, 6.2);
  const STATES = [[8.4, "APPROVED · 87 ms", true], [10.2, "DECLINED · 92 ms", false]];
  for (let k = 0; t >= 23 + k * 1.6 && k < 4; k++) STATES.push([23 + k * 1.6, ...[["APPROVED · 81 ms", true], ["APPROVED · 74 ms", true], ["DECLINED · 96 ms", false]][k % 3]]);
  let st = null;
  for (const sItem of STATES) if (t >= sItem[0]) st = sItem;
  if (st) {
    const k = easeOut(prog(t, st[0], 0.3));
    const on = st[2] ? stampOK : stampNO, off = st[2] ? stampNO : stampOK;
    O(on, k); O(off, 0);
    T(on, `translate(890,369) rotate(${((1 - k) * -30).toFixed(1)}) scale(${(1.6 - 0.6 * k).toFixed(3)}) translate(-890,-369)`);
    latText.textContent = st[1];
    latRect.setAttribute("fill", st[2] ? C.teal : C.coral);
    popIn(latPill, 890, 296, t, STATES[0][0], 0.4);
  } else { O(stampOK, 0); O(stampNO, 0); O(latPill, 0); }

  // ---- row 2
  riseIn(bSupa, t, 10.6, 0.6, 50);
  cyls.forEach((c, k) => {
    popIn(c.g, c.cx, 610, t, 10.9 + k * 0.14, 0.5);
    const level = k === 3 ? 0.35 : Math.min(0.85, 0.15 + 0.14 * countEased(t, ARR[`c${k}`]));
    const h = level * 72;
    c.liquid.setAttribute("y", (646 - h).toFixed(1));
    c.liquid.setAttribute("height", h.toFixed(1));
  });
  wire("d1", t, 11.0); wire("d2", t, 11.1); wire("d3", t, 11.2);

  // ---- row 3
  riseIn(bDbx, t, 14.6, 0.6, 50);
  ["i1", "i2", "i3", "i4"].forEach((p, k) => wire(p, t, 15.0 + k * 0.08));
  wire("m1", t, 15.3, 0.4); wire("m2", t, 15.5, 0.4);
  coins.forEach((c, k) => {
    const times = ARR[["bronze", "silver", "gold"][k]];
    popIn(c.g, c.cx, 875, t, 14.9 + k * 0.2, 0.55);
    // coin flip on arrival (story beats only), bump during the outro
    const a = lastBefore(t, times.filter((x) => x < 23));
    const f = a > 0 ? prog(t, a, 0.45) : 1;
    const sx = f < 1 ? Math.max(0.06, Math.abs(Math.cos(f * Math.PI))) : 1;
    const b = 1 + 0.1 * bump(t, times.filter((x) => x >= 23));
    T(c.face, scaleAt(c.cx, 875, sx * b, b));
    const sh = a > 0 ? prog(t, a + 0.2, 0.5) : 0;
    O(c.shine, sh > 0 && sh < 1 ? 0.45 : 0);
    T(c.shine, `translate(${lerp(-80, 80, sh).toFixed(1)},0) rotate(25 ${c.cx} 875)`);
    O(c.label, prog(t, 15.0 + k * 0.2, 0.4));
  });

  // ---- row 4
  [k1, k2, k3].forEach((k, i) => {
    riseIn(k.g, t, 19.2 + i * 0.15, 0.6, 50);
    popIn(k.icon, [130, 445, 760][i], 1130, t, 19.5 + i * 0.15, 0.5);
    k.r.setAttribute("stroke-width", (2 + 3 * bump(t, ARR[`k${i + 1}`])).toFixed(2));
  });
  wire("g1", t, 19.5, 0.7); wire("g2", t, 19.5, 0.6); wire("g3", t, 19.5, 0.45);
  const alerts = ARR.k2.filter((a) => a <= t).length;
  badgeText.textContent = String(alerts);
  popIn(badge, 470, 1102, t, ARR.k2[0] ?? 99, 0.35, 0.3 * bump(t, ARR.k2, 0.3));
  const grow = Math.min(1, countEased(t, ARR.k3, 0.6) / 2);
  bars.forEach((b, k) => {
    const h = BAR_MAX[k] * grow * (1 + 0.12 * Math.sin(t * 3 + k * 1.7) * grow);
    b.setAttribute("y", (1146 - h).toFixed(1)); b.setAttribute("height", h.toFixed(1));
  });
  miniPupils.forEach((p, k) => p.setAttribute("cx", [119, 141][k] + 3 * Math.sin(t * 1.4)));
  wire("loop", t, 21.0, 1.0);
  O(loopLabel, prog(t, 21.5, 0.5));
  O(footer, prog(t, 23.6, 0.6));

  // ---- particles with comet trails
  let n = 0;
  for (const p of P) {
    if (t < p.s || t > p.s + p.d || n >= pool.length) continue;
    const path = $(p.path), L = pathLen[p.path];
    const at = (tt) => path.getPointAtLength(L * easeInOut(clamp((tt - p.s) / p.d)));
    const head = at(t);
    const slot = pool[n++];
    O(slot.g, 1);
    slot.halo.setAttribute("cx", head.x); slot.halo.setAttribute("cy", head.y); slot.halo.setAttribute("fill", p.color);
    slot.core.setAttribute("cx", head.x); slot.core.setAttribute("cy", head.y);
    slot.core.setAttribute("fill", p.color === C.gold ? "#FFF4D6" : "#FFE1E1");
    slot.ghosts.forEach((g, j) => {
      const q = at(t - (j + 1) * 0.03);
      g.setAttribute("cx", q.x); g.setAttribute("cy", q.y); g.setAttribute("fill", p.color);
      O(g, 0.55 * (1 - (j + 1) / TRAIL));
    });
  }
  for (; n < pool.length; n++) O(pool[n].g, 0);
}

window.render = render;
window.DURATION = DURATION;


// ---------- player controls ----------
let now = 0, playing = false, last = null;
const btn = $("ctlPlay"), scrub = $("ctlScrub"), clock = $("ctlClock");
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function setT(v) {
  now = clamp(v, 0, DURATION);
  render(now);
  scrub.value = now;
  clock.textContent = `${fmt(now)} / ${fmt(DURATION)}`;
}
function tick(ts) {
  if (!playing) return;
  if (last !== null) now += (ts - last) / 1000;
  last = ts;
  if (now >= DURATION) { setT(DURATION); pause(); return; }
  setT(now);
  requestAnimationFrame(tick);
}
function play() { if (now >= DURATION - 0.05) now = 0; playing = true; last = null; btn.textContent = "Pause"; requestAnimationFrame(tick); }
function pause() { playing = false; btn.textContent = "Play"; }
btn.addEventListener("click", () => (playing ? pause() : play()));
$("ctlReplay").addEventListener("click", () => { now = 0; play(); });
scrub.addEventListener("input", () => { pause(); setT(Number(scrub.value)); });

const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
document.fonts.ready.then(() => {
  if (reduce) { setT(DURATION - 0.6); pause(); }
  else { setT(0); play(); }
});
setT(DURATION - 0.6);  // complete diagram until fonts are ready
</script>
