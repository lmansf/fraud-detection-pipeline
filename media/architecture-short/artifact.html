<title>Owl Park Pipeline Short</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap">
<style>
  /* Layout: one centered column; the animation is the page, controls sit directly under it. */
  :root {
    --bg: #070B16;
    --panel: #0F1628;
    --line: #22304D;
    --fg: #F1F5F9;
    --muted: #94A3B8;
    --accent: #F5B942;
    --font: Inter, "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); }
  main { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 40px; display: grid; gap: 16px; }
  header { display: grid; gap: 4px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
  h1 { margin: 0; font-size: clamp(22px, 5vw, 28px); font-weight: 800; text-wrap: balance; }
  .frame { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--bg); }
  #stage { display: block; width: 100%; height: auto; aspect-ratio: 1080 / 1350; font-family: var(--font); }
  .controls { display: flex; align-items: center; gap: 12px; }
  .controls button {
    font: 600 14px var(--font); color: var(--bg); background: var(--accent);
    border: 0; border-radius: 999px; padding: 9px 18px; cursor: pointer; min-width: 84px;
  }
  .controls button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  .controls button:focus-visible, #ctlScrub:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  #ctlScrub { flex: 1; min-width: 0; accent-color: var(--accent); }
  #ctlClock { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .note { margin: 0; font-size: 13px; line-height: 1.55; color: var(--muted); }
  .note code { color: var(--fg); font-size: 12px; }
</style>

<main>
  <header>
    <span class="eyebrow">LinkedIn short · 1080 × 1350 · 28 s</span>
    <h1>How the Owl Park fraud pipeline works</h1>
  </header>
  <div class="frame">
<svg id="stage" role="img" aria-label="Animated walkthrough: an Owl Park checkout is scored in real time by Model 1, events land in Supabase raw tables, Databricks refines them through bronze, silver and gold layers, and gold feeds Model 1, the Model 2 safety net and self-service dashboards." viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div class="controls">
    <button id="ctlPlay" type="button">Pause</button>
    <button id="ctlReplay" class="ghost" type="button">Replay</button>
    <input id="ctlScrub" type="range" min="0" max="28" step="0.01" value="0" aria-label="Scrub timeline">
    <span id="ctlClock">0:00 / 0:28</span>
  </div>
  <p class="note">The exported video is <code>media/architecture-short/owl-park-pipeline.mp4</code> in the repo, with <code>poster.png</code> for the thumbnail. Rebuild both with <code>node render.js</code>.</p>
</main>

<script>
// Motion-graphics build: the whole scene is generated here, and render(t) is a pure function of time.
const DURATION = 28;
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("stage");
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const backOut = (x) => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const prog = (t, start, dur) => clamp((t - start) / dur);
const lerp = (a, b, k) => a + (b - a) * k;

const C = {
  bg: "#0A1020", fg: "#F1F5F9", muted: "#94A3B8", line: "#2A3858",
  gold: "#F5B942", coral: "#F87171", teal: "#2DD4BF", violet: "#A78BFA", sky: "#38BDF8",
  supa: "#3ECF8E", dbx: "#FF6A3D", ink: "#1A1210",

function el(tag, attrs = {}, parent = svg, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  parent.appendChild(e);
  return e;
}
const T = (e, tr) => e.setAttribute("transform", tr);
const O = (e, o) => e.setAttribute("opacity", clamp(o).toFixed(3));
const scaleAt = (cx, cy, sx, sy = sx) => `translate(${cx},${cy}) scale(${sx.toFixed(4)},${sy.toFixed(4)}) translate(${-cx},${-cy})`;

// ============================================================ defs
const defs = el("defs");
const glow = el("filter", { id: "glow", x: "-100%", y: "-100%", width: "300%", height: "300%" }, defs);
el("feGaussianBlur", { stdDeviation: "7" }, glow);
const soft = el("filter", { id: "shadow", x: "-30%", y: "-30%", width: "160%", height: "180%" }, defs);
el("feDropShadow", { dx: "0", dy: "10", stdDeviation: "10", "flood-color": "#000", "flood-opacity": "0.45" }, soft);
for (const [id, color] of [["arrow", "#5A6B92"], ["arrowGold", C.gold]]) {
  const m = el("marker", { id, viewBox: "0 0 10 10", refX: "8", refY: "5", markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse" }, defs);
  el("path", { d: "M0,0 L10,5 L0,10 z", fill: color }, m);
}
function grad(id, stops, attrs = {}, kind = "linearGradient") {
  const g = el(kind, { id, ...attrs }, defs);
  stops.forEach(([o, c, a = 1]) => el("stop", { offset: o, "stop-color": c, "stop-opacity": a }, g));
}
grad("orbGold", [["0%", C.gold, 0.16], ["100%", C.gold, 0]], {}, "radialGradient");
grad("orbViolet", [["0%", C.violet, 0.16], ["100%", C.violet, 0]], {}, "radialGradient");
grad("orbSky", [["0%", C.sky, 0.14], ["100%", C.sky, 0]], {}, "radialGradient");
grad("hdrFade", [["0.88", C.bg], ["1", C.bg, 0]], { x1: 0, y1: 0, x2: 0, y2: 1 });
grad("ftrFade", [["0", C.bg, 0], ["0.35", C.bg]], { x1: 0, y1: 0, x2: 0, y2: 1 });
grad("supaPanel", [["0", "#11241F"], ["1", "#0A1514"]], { x1: 0, y1: 0, x2: 0, y2: 1 });
grad("dbxPanel", [["0", "#21160F"], ["1", "#140E0C"]], { x1: 0, y1: 0, x2: 0, y2: 1 });
grad("cylBody", [["0", "#0C3026"], ["0.62", "#1E6A50"], ["1", "#0C3026"]], { x1: 0, y1: 0, x2: 1, y2: 0 });
grad("liquid", [["0", "#6EF0B4"], ["1", "#23A26B"]], { x1: 0, y1: 0, x2: 0, y2: 1 });
grad("coinBronze", [["0%", "#EDB27A"], ["100%", "#A4632F"]], { cx: "38%", cy: "32%", r: "75%" }, "radialGradient");
grad("coinSilver", [["0%", "#F7F9FC"], ["100%", "#97A3B5"]], { cx: "38%", cy: "32%", r: "75%" }, "radialGradient");
grad("coinGold", [["0%", "#FFE69A"], ["100%", "#D49B12"]], { cx: "38%", cy: "32%", r: "75%" }, "radialGradient");
grad("device", [["0", "#2A3752"], ["1", "#141B2D"]], { x1: 0, y1: 0, x2: 0, y2: 1 });
grad("shield", [["0", "#8B6CF0"], ["1", "#3A2A80"]], { x1: 0, y1: 0, x2: 0, y2: 1 });
grad("barGrad", [["0", "#7DD3FC"], ["1", "#0EA5E9"]], { x1: 0, y1: 0, x2: 0, y2: 1 });
const dotPat = el("pattern", { id: "dotgrid", width: "36", height: "36", patternUnits: "userSpaceOnUse" }, defs);
el("circle", { cx: "2", cy: "2", r: "1.4", fill: "#18223B" }, dotPat);
const irisMask = el("mask", { id: "iris", maskUnits: "userSpaceOnUse", x: "0", y: "0", width: "1080", height: "1350" }, defs);
el("rect", { width: "1080", height: "1350", fill: "#000" }, irisMask);
const irisC = el("circle", { cx: "540", cy: "520", r: "0", fill: "#fff" }, irisMask);

// ============================================================ the owl (shared illustration)
const OWL = { body: "#1E2A47", wing: "#141D33", belly: "#2B3B62", disc: "#F3E7CF", beak: "#E09B4F" };
const OWL_SIL = "M-52,-68 C-35,-50 -15,-46 0,-46 C15,-46 35,-50 52,-68 C60,-38 64,-8 60,17 C56,52 32,68 0,68 C-32,68 -56,52 -60,17 C-64,-8 -60,-38 -52,-68 Z";
function drawOwl(parent, cx, cy, sc, outline = 3) {
  const root = el("g", { transform: `translate(${cx},${cy}) scale(${sc})` }, parent);
  const body = el("g", { filter: "url(#shadow)" }, root);
  el("path", { d: OWL_SIL, fill: OWL.body }, body);
  el("path", { d: "M-58,4 C-70,24 -66,48 -48,60 C-52,42 -52,24 -46,8 Z M58,4 C70,24 66,48 48,60 C52,42 52,24 46,8 Z", fill: OWL.wing }, root);
  el("ellipse", { cx: 0, cy: 44, rx: 32, ry: 20, fill: OWL.belly }, root);
  el("path", { d: "M-16,34 Q-12,39 -8,34 M8,34 Q12,39 16,34 M-4,48 Q0,53 4,48", fill: "none", stroke: C.gold, "stroke-opacity": 0.55, "stroke-width": 2, "stroke-linecap": "round" }, root);
  for (const x of [-22, 22]) el("circle", { cx: x, cy: -6, r: 26, fill: OWL.disc }, root);
  el("path", { d: "M-52,-36 L0,-17 L52,-36 L52,-50 L-52,-50 Z", fill: OWL.body }, root);
  const eyes = el("g", {}, root);
  const pupils = [], shines = [];
  for (const x of [-22, 22]) {
    el("circle", { cx: x, cy: -6, r: 17, fill: C.gold }, eyes);
    pupils.push(el("circle", { cx: x, cy: -6, r: 8.5, fill: C.bg }, eyes));
    shines.push(el("circle", { cx: x - 3.5, cy: -9.5, r: 3.2, fill: "#fff" }, eyes));
  }
  el("path", { d: "M-7,10 Q0,28 7,10 Q0,14 -7,10 Z", fill: OWL.beak }, root);
  el("path", { d: "M-18,68 l3,6 M-12,68 l0,7 M-6,68 l-3,6 M6,68 l3,6 M12,68 l0,7 M18,68 l-3,6", fill: "none", stroke: OWL.beak, "stroke-width": 3, "stroke-linecap": "round" }, root);
  el("path", { d: OWL_SIL, fill: "none", stroke: C.gold, "stroke-width": outline, "stroke-linejoin": "round" }, root);
  return {
    root, eyes,
    look(dx, dy) {
      pupils.forEach((p, k) => { p.setAttribute("cx", [-22, 22][k] + dx); p.setAttribute("cy", -6 + dy); });
      shines.forEach((h, k) => { h.setAttribute("cx", [-25.5, 18.5][k] + dx); h.setAttribute("cy", -9.5 + dy); });
    },
    blink(k) { T(eyes, scaleAt(0, -6, 1, 1 - 0.92 * k)); },
  };
}
function gearPath(r1, r2, teeth) {
  let d = "";
  for (let i = 0; i < teeth * 2; i++) {
    const a0 = (Math.PI * i) / teeth, a1 = (Math.PI * (i + 1)) / teeth, r = i % 2 ? r2 : r1;
    d += `${i ? "L" : "M"}${(r * Math.cos(a0 + 0.08)).toFixed(2)},${(r * Math.sin(a0 + 0.08)).toFixed(2)} L${(r * Math.cos(a1 - 0.08)).toFixed(2)},${(r * Math.sin(a1 - 0.08)).toFixed(2)} `;
  }
  return d + "Z";
}

// ============================================================ intro layer
el("rect", { width: "1080", height: "1350", fill: C.bg });
const intro = el("g");
const introOwlWrap = el("g", {}, intro);
const introOwl = drawOwl(introOwlWrap, 540, 500, 1.55, 3);
const introTitle = el("text", { x: 540, y: 712, "text-anchor": "middle", "font-size": 66, "font-weight": 800, fill: C.fg }, intro, "Catching fraud at Owl Park");
const introSub = el("text", { x: 540, y: 772, "text-anchor": "middle", "font-size": 32, fill: C.muted }, intro, "How the data pipeline works, in under 30 seconds");

// ============================================================ scene layer (revealed by the iris wipe)
const scene = el("g", { mask: "url(#iris)" });
const irisRing = el("circle", { cx: 540, cy: 520, r: 0, fill: "none", stroke: C.gold, "stroke-width": 10 });
el("rect", { width: "1080", height: "1350", fill: C.bg }, scene);
const orbs = [
  el("circle", { r: 460, fill: "url(#orbGold)" }, scene),
  el("circle", { r: 520, fill: "url(#orbViolet)" }, scene),
  el("circle", { r: 420, fill: "url(#orbSky)" }, scene),
];
el("rect", { width: "1080", height: "1350", fill: "url(#dotgrid)" }, scene);
const world = el("g", {}, scene);

// ---------- panels (behind everything) ----------
// Databricks: a column for the generator job, widening at the bottom into the medallion layers.
const dbxColumn = el("rect", { x: 80, y: 318, width: 220, height: 422, rx: 26, fill: "url(#dbxPanel)", stroke: C.dbx, "stroke-opacity": 0.5, "stroke-width": 2 }, world);
const dbxFull = el("path", {
  d: "M106,318 H274 Q300,318 300,344 V734 Q300,760 326,760 H974 Q1000,760 1000,786 V964 Q1000,990 974,990 H106 Q80,990 80,964 V344 Q80,318 106,318 Z",
  fill: "url(#dbxPanel)", stroke: C.dbx, "stroke-opacity": 0.5, "stroke-width": 2,
}, world);
const dbxTitle = el("text", { x: 190, y: 350, "text-anchor": "middle", "font-size": 16, "font-weight": 800, "letter-spacing": 4, fill: C.dbx }, world, "DATABRICKS");
const medLabel = el("text", { x: 980, y: 796, "text-anchor": "end", "font-size": 16, "font-weight": 800, "letter-spacing": 4, fill: C.dbx }, world, "MEDALLION LAYERS");
const bSupa = el("g", {}, world);
el("rect", { x: 330, y: 520, width: 670, height: 182, rx: 26, fill: "url(#supaPanel)", stroke: C.supa, "stroke-opacity": 0.5, "stroke-width": 2 }, bSupa);
const supaLabel = el("text", { x: 980, y: 554, "text-anchor": "end", "font-size": 16, "font-weight": 800, "letter-spacing": 4, fill: C.supa }, bSupa, "SUPABASE");
el("tspan", { "font-weight": 400, "letter-spacing": 1, fill: C.muted }, supaLabel, "  ·  raw tables");

// ---------- wires ----------
const wires = el("g", { fill: "none", "stroke-width": 3, "stroke-linecap": "round", "stroke-linejoin": "round" }, world);
const WIRES = {
  a1: ["M258,418 C340,418 420,382 500,382", "#5A6B92", "arrow"],
  a2: ["M650,382 H846", "#5A6B92", "arrow"],
  d1: ["M190,530 V546 H420 V572", "#2C6B52"],
  d2: ["M575,504 V572", "#2C6B52"],
  d3: ["M890,504 V522 H730 V572", "#2C6B52"],
  i1: ["M420,702 V730 H250 V816", "#7A4A33"],
  i2: ["M575,702 V730 H250 V816", "#7A4A33"],
  i3: ["M730,702 V730 H250 V816", "#7A4A33"],
  i4: ["M885,702 V730 H250 V816", "#7A4A33"],
  m1: ["M308,875 H477", "#5A6B92", "arrow"],
  m2: ["M598,875 H767", "#5A6B92", "arrow"],
  g1: ["M888,875 H960 V1025 H225 V1060", "#6B5A2A"],
  g2: ["M888,875 H960 V1025 H535 V1060", "#6B5A2A"],
  h1: ["M352,1130 H396", "#8B7BD8", "arrow"],
  g3: ["M888,875 H960 V1060", "#6B5A2A"],
  loop: ["M80,1130 H45 V266 H575 V296", C.gold, "arrowGold"],
};
const pathLen = {};
for (const [id, [d, stroke, marker]] of Object.entries(WIRES)) {
  const p = el("path", { id, d, stroke }, wires);
  if (marker) p.setAttribute("marker-end", `url(#${marker})`);

const loopLabel = el("text", { x: 64, y: 256, "font-size": 19, "font-weight": 600, "font-style": "italic", fill: C.gold }, world, "retrain & deploy");

// ---------- order generator (Databricks job) ----------
const nGen = el("g", {}, world);
const term = el("g", { filter: "url(#shadow)" }, nGen);
el("rect", { x: 126, y: 366, width: 128, height: 106, rx: 12, fill: "#0E1322", stroke: C.dbx, "stroke-opacity": 0.65, "stroke-width": 2 }, term);
el("path", { d: "M126,378 Q126,366 138,366 H242 Q254,366 254,378 V386 H126 Z", fill: "#1B2234" }, term);
[[140, C.coral], [152, C.gold], [164, C.teal]].forEach(([cx, fill]) => el("circle", { cx, cy: 376, r: 3.5, fill }, term));
const termClip = el("clipPath", { id: "termClip" }, defs);
el("rect", { x: 130, y: 389, width: 120, height: 80 }, termClip);

const LOG_COLORS = [C.gold, C.teal, C.violet, C.gold, C.sky, C.teal, C.coral];

el("circle", { cx: 0, cy: 0, r: 17, fill: C.dbx }, gear);

el("text", { x: 575, y: 495, "text-anchor": "middle", "font-size": 15, fill: C.muted }, nOwl, "real-time score");

// ---------- response device ----------
const nResp = el("g", {}, world);
const dev = el("g", { filter: "url(#shadow)" }, nResp);
el("rect", { x: 850, y: 316, width: 80, height: 138, rx: 16, fill: "url(#device)", stroke: "#3B4A6B", "stroke-width": 2 }, dev);

const CYL = [[420, "transactions"], [575, "decisions"], [730, "responses"], [885, "fraud truth"]];
const cyls = CYL.map(([cx, label], k) => {
  const g = el("g", {}, world);

  const liquid = el("path", { d: "", fill: "url(#liquid)", opacity: 0.85, "clip-path": `url(#cylClip${k})` }, g);
  el("path", { d: `M${cx - 28},592 V640`, stroke: "#fff", "stroke-opacity": 0.18, "stroke-width": 5, "stroke-linecap": "round" }, g);
  el("ellipse", { cx, cy: 584, rx: 38, ry: 10, fill: "#16503D", stroke: C.supa, "stroke-width": 1.5, "stroke-dasharray": dash }, g);
  el("ellipse", { cx, cy: 584, rx: 26, ry: 5, fill: "#0C3026" }, g);
  el("text", { x: cx, y: 684, "text-anchor": "middle", "font-size": 17, "font-weight": 600, fill: "#E2E8F0" }, g, label);
  return { g, liquid, cx };

const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function setT(v) {
  now = clamp(v, 0, DURATION);
  render(now);
  scrub.value = now;
  clock.textContent = `${fmt(now)} / ${fmt(DURATION)}`;
}
function tick(ts) {
  if (!playing) return;
  if (last !== null) now += (ts - last) / 1000;
  last = ts;
  if (now >= DURATION) { setT(DURATION); pause(); return; }
  setT(now);
  requestAnimationFrame(tick);
}
function play() { if (now >= DURATION - 0.05) now = 0; playing = true; last = null; btn.textContent = "Pause"; requestAnimationFrame(tick); }
function pause() { playing = false; btn.textContent = "Play"; }
btn.addEventListener("click", () => (playing ? pause() : play()));
$("ctlReplay").addEventListener("click", () => { now = 0; play(); });
scrub.addEventListener("input", () => { pause(); setT(Number(scrub.value)); });

const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
document.fonts.ready.then(() => {
  if (reduce) { setT(DURATION - 0.6); pause(); }
  else { setT(0); play(); }
});
setT(DURATION - 0.6);  // complete diagram until fonts are ready
</script>
